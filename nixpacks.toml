# Nixpacks build config — Railway / Render compatible
# Docs: https://nixpacks.com/docs/configuration/file

[phases.setup]
nixPkgs = ['php83', 'php83Extensions.pgsql', 'php83Extensions.pdo_pgsql', 'php83Extensions.mbstring',
            'php83Extensions.xml', 'php83Extensions.curl', 'php83Extensions.zip',
            'php83Extensions.tokenizer', 'php83Extensions.bcmath', 'php83Extensions.gd',
            'php83Extensions.redis', 'php83Extensions.intl',
            'nodejs_20', 'npm', 'composer']

[phases.install]
cmds = [
    'composer install --no-dev --optimize-autoloader --no-interaction',
    'npm ci',
    'npm run build',
]

[phases.build]
cmds = [
    'php artisan config:cache',
    'php artisan route:cache',
    'php artisan view:cache',
    'php artisan migrate --force',
]

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=${PORT:-8080}'
